<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
<!-- Original dark grey swoosh wallpaper for the AI Teammates computer. 16:10. -->
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2b2b2d"/><stop offset=".45" stop-color="#1b1b1d"/><stop offset="1" stop-color="#2a2a2c"/>
  </linearGradient>
  <radialGradient id="shade" cx=".72" cy=".28" r=".55">
    <stop offset="0" stop-color="#050505" stop-opacity=".85"/><stop offset="1" stop-color="#050505" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lift" cx=".92" cy=".95" r=".5">
    <stop offset="0" stop-color="#5a5a5d" stop-opacity=".75"/><stop offset="1" stop-color="#5a5a5d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9a9a9e" stop-opacity=".0"/><stop offset=".25" stop-color="#8e8e92" stop-opacity=".75"/>
    <stop offset=".6" stop-color="#6c6c70" stop-opacity=".55"/><stop offset="1" stop-color="#6c6c70" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<rect width="1920" height="1200" fill="url(#base)"/>
<rect width="1920" height="1200" fill="url(#shade)"/>
<rect width="1920" height="1200" fill="url(#lift)"/>
<path d="M-60 -40 C 360 120, 620 420, 980 820 S 1500 1260, 1720 1300 L 1920 1300 L 1920 1200 C 1560 1160, 1300 900, 1020 600 S 420 80, 140 -80 Z" fill="url(#ribbon)" filter="url(#softer)" opacity=".55"/>
<path d="M60 -40 C 440 150, 700 430, 1040 790 S 1460 1180, 1600 1260" fill="none" stroke="#a8a8ac" stroke-width="34" stroke-linecap="round" filter="url(#soft)" opacity=".45"/>
<path d="M20 -30 C 420 130, 680 420, 1020 780 S 1440 1170, 1580 1250" fill="none" stroke="#d0d0d4" stroke-width="5" stroke-linecap="round" filter="url(#soft)" opacity=".4"/>
<path d="M170 -40 C 540 170, 780 430, 1110 770 S 1480 1130, 1640 1220" fill="none" stroke="#0d0d0e" stroke-width="22" stroke-linecap="round" filter="url(#soft)" opacity=".55"/>
</svg>
